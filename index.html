<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پایگاه جامع جنگ خاورمیانه و یاشار | Yashar & Middle East</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --border-color: #262626;
            --accent-color: #0095f6;
            --text-color: #ffffff;
            --text-secondary: #a8a8a8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; padding: 20px 10px; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; }
        
        .admin-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 35px; text-align: center; }
        .admin-card h2 { font-size: 1.1rem; margin-bottom: 6px; color: #fff; }
        .admin-card p { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 14px; }
        .input-group { display: flex; gap: 10px; max-width: 650px; margin: 0 auto; }
        .input-group input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: #000; color: #fff; direction: ltr; font-size: 0.9rem; }
        .input-group button { padding: 10px 20px; border-radius: 8px; border: none; background: var(--accent-color); color: white; font-weight: bold; cursor: pointer; }
        
        #preview-area { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .embed-wrapper { background: #000; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; max-width: 340px; text-align: right; }
        .post-caption { font-size: 0.85rem; color: var(--text-secondary); margin-top: 10px; line-height: 1.4; max-height: 100px; overflow-y: auto; padding: 5px; background: #0a0a0a; border-radius: 6px; }

        .section-title { font-size: 1.2rem; text-align: center; margin-bottom: 15px; color: #fff; }
        .feed-container { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 15px; margin-bottom: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- بخش اضافه کردن اخبار جنگ خاورمیانه از هر پیجی به همراه متن/کپشن -->
        <div class="admin-card">
            <h2>افزودن پست‌های جنگ خاورمیانه (از هر پیجی)</h2>
            <p>لینک پست را وارد کنید تا همراه با قابلیت خواندن متن آن در سایت نمایش داده شود</p>
            <div class="input-group">
                <input type="text" id="insta-link" placeholder="https://www.instagram.com/p/...">
                <button onclick="displayMedia()">نمایش پست و متن</button>
            </div>
            <div id="preview-area"></div>
        </div>

        <h2 class="section-title">پست‌ها و محتوای پیج یاشار</h2>

        <!-- بخش فید خودکار اینستاگرام یاشار -->
        <div class="feed-container">
            <script src="https://elfsightcdn.com/platform.js" async></script>
            <div class="elfsight-app-582989a3-bd09-434e-8a13-7d10ee950258" data-elfsight-app-lazy></div>
        </div>
    </div>

    <script>
        function displayMedia() {
            const input = document.getElementById('insta-link').value.trim();
            const preview = document.getElementById('preview-area');
            if (!input) { alert('لطفاً لینک اینستاگرام را وارد کنید.'); return; }
            
            let cleanUrl = input.split('?')[0];
            if (!cleanUrl.endsWith('/')) cleanUrl += '/';
            cleanUrl += 'embed';

            const wrapper = document.createElement('div');
            wrapper.className = 'embed-wrapper';
            wrapper.innerHTML = `
                <iframe src="${cleanUrl}" width="320" height="400" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
                <div class="post-caption">برای خواندن کامل جزئیات و متن این پست خبری، می‌توانید روی خود پست یا آیکون اینستاگرام در گوشه آن کلیک کنید.</div>
            `;
            preview.appendChild(wrapper);
            document.getElementById('insta-link').value = '';
        }
    </script>
</body>
</html>
