<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه اختصاصی یاشار | Yashar Instagram</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --border-color: #262626;
            --accent-color: #0095f6;
            --text-color: #ffffff;
            --text-secondary: #a8a8a8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; padding: 20px 10px; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; }
        .downloader-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px 20px; margin-bottom: 35px; text-align: center; }
        .downloader-card h2 { font-size: 1.2rem; margin-bottom: 8px; }
        .downloader-card p { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 18px; }
        .input-group { display: flex; gap: 10px; max-width: 650px; margin: 0 auto; }
        .input-group input { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border-color); background: #000; color: #fff; direction: ltr; }
        .input-group button { padding: 12px 24px; border-radius: 10px; border: none; background: var(--accent-color); color: white; font-weight: bold; cursor: pointer; }
        #preview-area { margin-top: 20px; display: flex; justify-content: center; }
        #preview-area iframe { border-radius: 12px; border: 1px solid var(--border-color); max-width: 100%; }
        .section-title { font-size: 1.3rem; text-align: center; margin-bottom: 20px; color: #fff; }
        .feed-container { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="downloader-card">
            <h2>نمایش ویدیو و پست از لینک اینستاگرام</h2>
            <p>لینک پست یا ریلز مورد نظر را در کادر زیر وارد کنید</p>
            <div class="input-group">
                <input type="text" id="insta-link" placeholder="https://www.instagram.com/p/... یا /reel/...">
                <button onclick="displayMedia()">نمایش ویدیو</button>
            </div>
            <div id="preview-area"></div>
        </div>

        <h2 class="section-title">محتوا و پست‌های پیج یاشار</h2>

        <div class="feed-container">
            <script src="https://elfsightcdn.com/platform.js" async></script>
            <div class="elfsight-app-582989a3-bd09-434e-8a13-7d10ee950258" data-elfsight-app-lazy></div>
        </div>
    </div>

    <script>
        function displayMedia() {
            const input = document.getElementById('insta-link').value.trim();
            const preview = document.getElementById('preview-area');
            if (!input) { alert('لطفاً لینک پست یا ریلز اینستاگرام را وارد کنید.'); return; }
            preview.innerHTML = '<p style="color: var(--text-secondary);">در حال دریافت...</p>';
            let cleanUrl = input.split('?')[0];
            if (!cleanUrl.endsWith('/')) cleanUrl += '/';
            cleanUrl += 'embed';
            setTimeout(() => {
                preview.innerHTML = `<iframe src="${cleanUrl}" width="400" height="480" frameborder="0" scrolling="no" allowtransparency="true"></iframe>`;
            }, 500);
        }
    </script>
</body>
</html>
